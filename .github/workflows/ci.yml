name: macOS and Windows package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python scripts/check_public.py
      - run: uv build
      - run: uv run --frozen python scripts/check_public.py --archives dist
      - run: uv run --frozen python scripts/verify_wheel.py
