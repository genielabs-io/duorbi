name: macOS and Windows package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Diagnose macOS cancellation
        if: matrix.os == 'macos-latest' && matrix.python == '3.14'
        shell: bash
        run: |
          uv run --frozen python - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tests')
          from test_agy_transport import PersistentTransportTests
          suite = unittest.TestSuite(PersistentTransportTests(
              'test_http_cancel_waits_for_owned_tree_and_releases_context_lock')
              for _ in range(200))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - run: uv run --frozen python scripts/check_public.py
      - run: uv build
      - run: uv run --frozen python scripts/check_public.py --archives dist
      - run: uv run --frozen python scripts/verify_wheel.py
